<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আসমাউল হুসনা - ৯৯ নাম</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}
h1{margin:15px;}
.search{
    width:90%; max-width:400px; padding:10px;
    border-radius:20px; border:none; outline:none; font-size:16px;
}
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px; padding:10px;
}
.card{
    background:rgba(255,255,255,0.1);
    border-radius:15px; padding:12px;
    backdrop-filter: blur(10px);
    transition:0.3s; cursor:pointer;
    border:1px solid rgba(255,255,255,0.2);
}
.card:hover{transform:scale(1.05);}
.card:active{transform:scale(0.92);}
.ar{font-size:20px;}
.count{margin-top:8px;font-size:14px;}
.btn{
    margin-top:6px; padding:6px 10px; border-radius:10px;
    border:2px solid white; background:none; color:white; cursor:pointer; transition:0.3s;
}
.btn:hover{background:white;color:black;}
.btn:active{transform:scale(0.9);}
.modal{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center;
}
.modal-content{
    background:#1e3c50; padding:20px; border-radius:15px; width:90%; max-width:400px;
}
.close-btn{
    margin-top:10px; padding:10px; border-radius:10px; border:2px solid white;
    background:none; color:white; cursor:pointer; transition:0.3s;
}
.close-btn:hover{background:white;color:black;}
</style>
</head>

<input class="search" placeholder="নাম খুঁজুন..." onkeyup="search(this.value)">
<div class="container" id="box"></div>

        <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>

// কাউন্টার
let counts=new Array(names.length).fill(0);

function render(data){
    let html="";
    data.forEach((n,i)=>{
        html+=`
        <div class="card" onclick="show(${i})">
            <div class="ar">${n[0]}</div>
            <div>${n[1]}</div>
            <div>${n[2]}</div>
            <div class="count">Count: ${counts[i]}</div>
            <button class="btn" onclick="add(${i});event.stopPropagation()">+1</button>
            <button class="btn" onclick="reset(${i});event.stopPropagation()">Reset</button>
        </div>`;
    });
    document.getElementById("box").innerHTML=html;
}

function add(i){counts[i]++;render(names);}
function reset(i){counts[i]=0;render(names);}

function show(i){
    document.getElementById("modal").style.display="flex";
    document.getElementById("mName").innerText=names[i][0]+" ("+names[i][1]+")";
    document.getElementById("mMeaning").innerText="অর্থ: "+names[i][2];
    document.getElementById("mFazilat").innerText="ফজিলত: "+names[i][3];
    document.getElementById("mCountRec").innerText="Recommended Count: "+names[i][4];
}

function closeModal(){document.getElementById("modal").style.display="none";}

function search(val){
    val=val.toLowerCase();
    let filtered=names.filter(n=>n[1].toLowerCase().includes(val)||n[2].includes(val));
    render(filtered);
}

render(names);
</script>
